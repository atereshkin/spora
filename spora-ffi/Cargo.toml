[package]
name = "spora-ffi"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
spora-core = {path="../spora-core"}
uniffi = { version = "0.30.0", features = [ "cli" ] }
tokio = "1.48.0"
once_cell = "1.21.3"
thiserror = "2.0.17"
url = "2.5.7"
log = "0.4.29"
tokio-util = "0.7.17"

# Android uses android_logger; Apple targets use oslog (unified logging,
# visible in Console.app / `log stream`). Gated so each only pulls its own.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
oslog = { version = "0.2.0", default-features = false, features = ["logger"] }

[build-dependencies]
uniffi = { version = "0.30.0", features = [ "build" ] }

[lib]
# cdylib: used to generate bindings (uniffi-bindgen reads a built library).
# staticlib: linked into the macOS/iOS NetworkExtension appex.
crate-type = ["cdylib", "staticlib"]
name = "spora_ffi"

[[bin]]
# This can be whatever name makes sense for your project, but the rest of this tutorial assumes uniffi-bindgen.
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
