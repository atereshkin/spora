[package]
name = "relay"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"]}
socket2 = "0.5.6"
clap = { version = "4.5.52", features = ["derive"] }
log = "0.4.29"
env_logger = "0.11.8"
relay-client = { path = "../relay-client" }
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
