[package]
name = "spora-core"
version = "0.1.0"
edition = "2021"

[dependencies]
netstack-smoltcp = "0.2.0"
tokio = { version = "1.40.0", features = ["full"] }
tokio-util = { version = "0.7.17" }
futures-util = "0.3.31"
log = "0.4.22"
socket2 = "0.5.6"
stunclient={version = "0.4"}
relay-client={path="../relay-client"}
url = "2.5.7"
etherparse = "0.16.0"
rand = "0.8"
libc = "0.2"
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = "0.13"
ring = "0.17"

[dev-dependencies]
tokio = { version = "1.40.0", features = ["full", "test-util"] }
