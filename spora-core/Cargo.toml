[package]
name = "spora-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
netstack-smoltcp = { path = "../vendor/netstack-smoltcp" }
tokio = { version = "1.40.0", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["codec"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
bytes = "1"
futures-util = "0.3.31"
log = "0.4.22"
socket2 = "0.5.6"
stunclient={version = "0.4"}
relay-client={path="../relay-client"}
url = "2.5.7"
etherparse = "0.16.0"
rand = "0.8"
libc = "0.2"
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = "0.13"
ring = "0.17"
# ring-accelerated: use ring's asm crypto (same backend as quinn/rustls) for the
# hot-path AEAD instead of snow's default pure-Rust ChaCha20Poly1305, which is
# ~100x slower in debug builds and left nz CPU-bound at ~19 Mbit/s there.
snow = { version = "0.10", features = ["ring-accelerated"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
subtle = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
lru = "0.18"

[dev-dependencies]
tokio = { version = "1.40.0", features = ["full", "test-util"] }
relay = { path = "../relay" }
env_logger = "0.11"
etherparse = "0.16.0"
tempfile = "3"
