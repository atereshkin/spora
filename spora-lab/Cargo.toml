[package]
name = "spora-lab"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
spora-core = { path = "../spora-core" }
relay = { path = "../relay" }
relay-client = { path = "../relay-client" }
tokio = { version = "1.40.0", features = ["full"] }
tokio-util = "0.7.17"
futures-util = "0.3.31"
log = "0.4.22"
env_logger = "0.11"
etherparse = "0.16.0"
smoltcp = { version = "0.12", default-features = false, features = [
    "std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-cubic",
] }
url = "2.5.7"
libc = "0.2"
serde_json = "1"
socket2 = "0.5.6"
# Tier-1 fingerprint inspector (src/quic_inspect.rs): HKDF-SHA256, AES-128-GCM,
# and QUIC header protection for decrypting captured QUIC v1 Initials in-tree
# (no external nDPI/tshark). Already in the workspace lock via rustls.
ring = "0.17"

# Lab suites manage namespaces from main() and must run scenarios
# sequentially inside one process, so they bypass libtest.
[[test]]
name = "smoke"
harness = false

[[test]]
name = "nat_matrix"
harness = false

[[test]]
name = "resilience"
harness = false

[[test]]
name = "conditions"
harness = false

# Performance regression suite: shaped-link hard gates + report-only
# metrics (see docs/lab.md, "Performance regression control").
[[test]]
name = "perf"
harness = false

# IPv6: outer transport over v6 (relay, STUN, punch) and inner v6 carried
# through the tunnel (netstack egress, fragmentation). Needs ip6tables.
[[test]]
name = "ipv6"
harness = false

# Connection log: real tunneled traffic on the netstack sharer must land as
# correct flow/session records in the sharer's connlog database.
[[test]]
name = "connlog"
harness = false

# Diagnostic record: the record spora-core writes must be a true account of
# what a real session did (steps, verdicts, samples, and the closing summary).
[[test]]
name = "record"
harness = false

# Plain tokio test (no namespaces): validates the traffic drivers over a
# loopback relay so it can run on any platform/CI without userns.
[[test]]
name = "peers_loopback"

# DPI-censorship (Tier 0): a signature-matching middlebox in the wan namespace
# drops Spora's on-wire fingerprints (REGISTER magic, QUIC v1 version word,
# punch markers); asserts each is blockable today and that removing it restores
# connectivity. Needs the iptables `string` match (self-skips without it).
[[test]]
name = "censorship"
harness = false

# DPI-fingerprint (Tier 1): capture the client's QUIC handshake off the wan leg
# and decrypt the Initial in-tree (quic_inspect) to verify the de-branded
# ClientHello (ALPN h3, no SNI) and emit the JA4-Q fingerprint. Needs tcpdump.
[[test]]
name = "fingerprint"
harness = false

# Tier-3-lite: capture a live nz relay session and verify the Shaper removed the
# structural DPI tells (fixed msg1 size, idx_B echo) from the wire. Needs tcpdump.
[[test]]
name = "shaper"
harness = false

# Recovery/UX spec suite: reconnect, roaming, sleep/dormancy, and NAT-expiry
# behavior across carriers, asserted against DESIRED user-experience budgets
# (seconds, not the current ~minute). Deliberately RED on today's code —
# budget misses are tagged known_gap(<root-cause>); SPORA_LAB_RECOVERY=xfail
# (CI) reports them as expected failures instead of failing the suite and
# flags a tagged budget that starts passing so the marker gets removed.
[[test]]
name = "recovery"
harness = false

# The CLI as a VPN client: runs the real `spora-cli` binary (sharer and
# client) in the lab namespaces and checks interface, routes, MTU, resolver,
# socket bypass and cleanup — and that `--tun-name` still touches nothing.
# Needs `target/debug/spora-cli` (build the workspace first).
[[test]]
name = "cli_vpn"
harness = false
