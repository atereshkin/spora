[workspace]
members = [
    "spora-core", "spora-cli",
    "relay", "relay-client", "spora-ffi",
    "spora-lab",
]
# Vendored third-party fork (netstack-smoltcp); built as a path dependency of
# spora-core but not a workspace member — we don't lint or test it as our own.
exclude = ["vendor/netstack-smoltcp"]
resolver = "3"

[workspace.dependencies]
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
