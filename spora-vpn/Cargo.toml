[package]
name = "spora-vpn"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Client-side host integration for a spora tunnel (TUN, routes, resolver, MTU, outer-socket bypass), shared by `spora use` and the Windows service"

[dependencies]
spora-core = { path = "../spora-core" }
tokio = { version = "1.48.0", features = ["rt", "sync", "macros", "time"] }
futures-util = "0.3.31"
log = "0.4.29"

[target.'cfg(target_os = "linux")'.dependencies]
# TUN device creation (ioctl); Linux-only crate, hence the narrow gate. macOS
# opens its utun control socket directly via libc (src/macos.rs) and Windows
# uses wintun (src/windows.rs).
tokio-tun = "0.12.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# wintun adapter (the DLL is loaded at runtime from next to the executable)
# plus the IP Helper API for addresses, routes, MTU and DNS (src/windows.rs).
wintun = "0.5"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
