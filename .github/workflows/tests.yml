name: tests

on:
  push:
    branches: [main, dumbrelay]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  deny:
    # licenses / advisories / bans / sources (config: deny.toml). A new RUSTSEC
    # advisory can turn this red without a code change — that is intentional.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  android-ffi:
    # spora-ffi must keep compiling for Android. Neither the host-target test
    # job nor the (release-only) FFI bundle build covers this between
    # releases, and the Android app repo builds the FFI from a pinned core
    # ref — this job catches android-target breakage at the commit that
    # causes it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-ffi
          cache-on-failure: true
      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
      - name: Check spora-ffi for Android
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk -t arm64-v8a check -p spora-ffi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Every red run otherwise recompiles the workspace from scratch —
          # the deps cache is worth saving even when a suite fails.
          cache-on-failure: true

      # The spora-lab suites run inside unprivileged user namespaces.
      # Ubuntu 24.04 restricts those via AppArmor by default; lift the
      # restriction and make sure netem's qdisc module is available.
      - name: Enable lab prerequisites
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo modprobe sch_netem || true

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace

      - name: Tests (unit + integration + network lab)
        run: cargo test --workspace
        env:
          RUST_LOG: info
          # A lab suite that cannot run must FAIL CI, not silently skip —
          # otherwise a runner-image change could disable all e2e coverage
          # while the build stays green.
          SPORA_LAB: require
          # The recovery suite asserts DESIRED reconnect/roam/sleep budgets
          # and is deliberately red on today's code (tests/recovery.rs). In
          # CI its tagged budget misses report as expected failures; a
          # tagged budget that starts PASSING fails, forcing the marker to
          # be removed together with the fix. Run locally without this env
          # to see the true state.
          SPORA_LAB_RECOVERY: xfail
          # Perf-suite metrics snapshot (test binaries run with the package
          # dir as cwd, so the path must be absolute), uploaded below for
          # trend tracking / perf-diff between commits (docs/lab.md,
          # "Performance regression control").
          SPORA_LAB_PERF_JSON: ${{ github.workspace }}/lab-perf.json

      - name: Upload perf metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-perf
          path: lab-perf.json
          if-no-files-found: warn
