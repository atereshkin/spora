name: tests

on:
  push:
    branches: [main, dumbrelay]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Every red run otherwise recompiles the workspace from scratch —
          # the deps cache is worth saving even when a suite fails.
          cache-on-failure: true

      # The spora-lab suites run inside unprivileged user namespaces.
      # Ubuntu 24.04 restricts those via AppArmor by default; lift the
      # restriction and make sure netem's qdisc module is available.
      - name: Enable lab prerequisites
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo modprobe sch_netem || true

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace

      - name: Tests (unit + integration + network lab)
        run: cargo test --workspace
        env:
          RUST_LOG: info
          # A lab suite that cannot run must FAIL CI, not silently skip —
          # otherwise a runner-image change could disable all e2e coverage
          # while the build stays green.
          SPORA_LAB: require
          # Perf-suite metrics snapshot (test binaries run with the package
          # dir as cwd, so the path must be absolute), uploaded below for
          # trend tracking / perf-diff between commits (docs/lab.md,
          # "Performance regression control").
          SPORA_LAB_PERF_JSON: ${{ github.workspace }}/lab-perf.json

      - name: Upload perf metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-perf
          path: lab-perf.json
          if-no-files-found: warn
