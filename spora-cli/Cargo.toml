[package]
name = "spora-cli"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
spora-core = { path = "../spora-core" }
clap = { version = "4.5.52", features = ["derive"] }
tokio = "1.48.0"
env_logger = "0.11.8"
futures-util = "0.3.31"
humantime = "2"
log = "0.4.29"
url = "2.5.7"

[target.'cfg(not(windows))'.dependencies]
tokio-tun = "0.12.1"

# jemalloc-sys does not build on (at least) aarch64-musl; the static musl
# release binaries use the system allocator instead (see main.rs GLOBAL).
[target.'cfg(all(not(windows), not(target_env = "musl")))'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
etherparse = "0.16.0"